services:

  # ✅ RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # ✅ Customer Service
  customerservice:
    container_name: customerservice
    build:
      context: ./CustomerService/CustomerService.Api
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./CustomerService/CustomerService.Api/Data:/app/Data
    depends_on:
      - rabbitmq

  # ✅ Product Service
  productservice:
    container_name: productservice
    build:
      context: ./ProductService/ProductService.Api
      dockerfile: Dockerfile
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./ProductService/ProductService.Api/Data:/app/Data
    depends_on:
      - rabbitmq

  # ✅ Order Service
  orderservice:
    container_name: orderservice
    build:
      context: ./OrderService/OrderService.Api
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CustomerServiceUrl: http://customerservice:8080
      ProductServiceUrl: http://productservice:8080
    volumes:
      - ./OrderService/OrderService.Api/Data:/app/Data
    depends_on:
      - customerservice
      - productservice
      - rabbitmq

  # ✅ Payment Service
  paymentservice:
    container_name: paymentservice
    build:
      context: ./PaymentService.Api
      dockerfile: Dockerfile
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./PaymentService.Api/Data:/app/Data
    depends_on:
      - rabbitmq

  # ✅ API Gateway
  apigateway:
    container_name: apigateway
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    ports:
      - "5050:8080"
    depends_on:
      - orderservice
      - paymentservice

volumes:
  rabbitmq-data: